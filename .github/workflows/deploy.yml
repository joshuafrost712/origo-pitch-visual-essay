name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a new push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project Pages serve under /<repo>/, so build with that base. Override
      # VITE_BASE here if the repo is renamed.
      - run: npm run build
        env:
          VITE_BASE: /origo-pitch-visual-essay/
          # Apps Script /exec URL for the sign-up sink. Set as a repository
          # Variable (Settings > Secrets and variables > Actions > Variables) so
          # the endpoint is not committed. Unset resolves to empty, and the site
          # renders its mailto invitation instead of a form that cannot work.
          VITE_SIGNUP_URL: ${{ vars.VITE_SIGNUP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default timeout is 600000ms, and on 2026-08-06 three
          # consecutive runs sat in `deployment_queued` past that and aborted,
          # while GitHub reported Pages operational. A timed-out run also CANCELS
          # its deployment id, and that id is derived from the commit sha, so
          # every retry of the same sha then failed instantly against an
          # already-cancelled deployment. Twenty minutes rides out a slow queue
          # instead of turning it into a stuck sha.
          timeout: 1200000
