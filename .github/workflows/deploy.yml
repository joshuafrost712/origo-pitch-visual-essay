name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a new push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project Pages serve under /<repo>/, so build with that base. Override
      # VITE_BASE here if the repo is renamed.
      - run: npm run build
        env:
          VITE_BASE: /origo-pitch-visual-essay/
          # Apps Script /exec URL for the sign-up sink. Set as a repository
          # Variable (Settings > Secrets and variables > Actions > Variables) so
          # the endpoint is not committed. Unset resolves to empty, and the site
          # renders its mailto invitation instead of a form that cannot work.
          VITE_SIGNUP_URL: ${{ vars.VITE_SIGNUP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Raised from the 600000ms default, but be warned it did NOT help when
          # it was tried: on 2026-08-06 five runs sat in `deployment_queued` and
          # aborted, and the run carrying timeout: 1200000 still gave up after
          # exactly ten minutes of polling, so something below this input caps
          # the queued phase. Pages reported operational throughout, and the
          # genre-research-app stalled three deployments the same day, so the
          # cause was GitHub-side and account-wide rather than anything here.
          #
          # What you actually need to know when it happens: an aborted run
          # CANCELS its deployment id, that id is the commit sha, and a cancelled
          # sha can never be redeployed. So the recovery is
          #   gh api -X POST repos/<owner>/<repo>/pages/deployments/<sha>/cancel
          # followed by a NEW commit. Re-running the same sha fails instantly
          # with "due to in progress deployment".
          timeout: 1200000
